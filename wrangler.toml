name = "forum-api"
main = "worker/src/index.ts"
compatibility_date = "2024-10-01"

# D1 binding (PHAN 4) — replace YOUR_DATABASE_ID after `npx wrangler d1 create forum-db`
[[d1_databases]]
binding = "DB"
database_name = "forum-db"
database_id = "8be936f2-b35a-412f-9587-9e5af6b2d4cc"
migrations_dir = "migrations"

# Single-origin deploy (guide PHAN 36): Worker serves frontend dist + /api
[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
# Must match the admin account from the guide
ADMIN_EMAIL = "nhantk123vip@gmail.com"
# If frontend is on another domain, set e.g. https://forum.example.com
# APP_ORIGIN = "https://forum.example.com"
